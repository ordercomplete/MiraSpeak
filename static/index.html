<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiraSpeak — AI-тьютор англійської</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --accent:#4f8cff; --text:#e6e9ef; --muted:#8b93a7; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--panel); display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #232733; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  select, button { background:#222633; color:var(--text); border:1px solid #323848; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #status { margin-left:auto; color:var(--muted); font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .mira { align-self:flex-start; background:var(--panel); }
  .corr { align-self:flex-start; background:#20261f; color:var(--ok); font-size:14px; border-left:3px solid var(--ok); }
  .err  { align-self:center; background:#2a1c1c; color:#ff8080; font-size:13px; }
  footer { padding:12px 16px; background:var(--panel); border-top:1px solid #232733; display:flex; gap:10px; align-items:center; }
  #mic { width:56px; height:56px; border-radius:50%; font-size:22px; background:var(--accent); border:none; }
  #mic.rec { background:#e5484d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #text { flex:1; padding:12px 14px; border-radius:24px; border:1px solid #323848; background:#222633; color:var(--text); font-size:15px; }
  #vuwrap { width:120px; height:14px; background:#222633; border:1px solid #323848; border-radius:7px; position:relative; overflow:hidden; display:flex; align-items:center; }
  #vubar { height:100%; width:0%; background:linear-gradient(90deg,#3ddc84,#ffd166,#e5484d); transition:width .08s linear; }
  #vutxt { position:absolute; right:6px; top:0; line-height:14px; font-size:10px; color:var(--muted); }
  nav.tabs { display:flex; gap:6px; margin-left:8px; }
  nav.tabs button { background:transparent; border:1px solid transparent; color:var(--muted); padding:6px 12px; border-radius:8px; font-size:14px; }
  nav.tabs button.active { color:var(--text); background:#222633; border-color:#323848; }
  body.learn .chat-only { display:none !important; }
  #learn { flex:1; overflow-y:auto; padding:16px; display:none; }
  .unit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; max-width:1000px; margin:0 auto; }
  .unit-card { background:var(--panel); border:1px solid #232733; border-radius:12px; padding:14px; cursor:pointer; transition:border-color .12s; }
  .unit-card:hover { border-color:var(--accent); }
  .unit-card .lv { font-size:11px; color:var(--muted); letter-spacing:.5px; }
  .unit-card .tt { font-weight:600; margin:5px 0 2px; font-size:15px; }
  .unit-card .tuk { color:var(--muted); font-size:13px; }
  .unit-card .meta { margin-top:10px; display:flex; align-items:center; gap:8px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; }
  .badge.ok { background:#16301f; color:var(--ok); }
  .badge.prog { background:#2e2a16; color:#ffd166; }
  .badge.new { background:#222633; color:var(--muted); }
  .stats { max-width:1000px; margin:0 auto 14px; display:flex; gap:10px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:10px 14px; font-size:13px; color:var(--muted); }
  .stat b { color:var(--text); font-size:18px; display:block; }
  .lesson { max-width:720px; margin:0 auto; }
  .lesson h2 { margin:0 0 2px; }
  .lesson .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .lesson h3 { font-size:14px; color:var(--accent); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.4px; }
  .lesson .sec { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:12px 14px; margin-bottom:12px; line-height:1.6; }
  .vlist { margin:0; padding-left:18px; }
  .vocab-row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #1e222c; }
  .vocab-row:last-child { border-bottom:none; }
  .vocab-row .u { color:var(--muted); }
  .backbtn { background:#222633; color:var(--text); border:1px solid #323848; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; margin-bottom:14px; }
  .qbox { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:14px; margin-bottom:12px; }
  .qbox .q { font-weight:600; margin-bottom:10px; line-height:1.5; }
  .qbox label { display:block; padding:8px 10px; border:1px solid #323848; border-radius:8px; margin:6px 0; cursor:pointer; font-size:14px; }
  .qbox label:hover { border-color:var(--accent); }
  .qbox input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #323848; background:#222633; color:var(--text); font-size:14px; }
  .res-ok { color:var(--ok); } .res-bad { color:#ff8080; }
  .explain { font-size:13px; color:var(--muted); margin-top:8px; padding:8px 10px; background:#1a1e26; border-radius:8px; }
  .drill { align-self:flex-start; background:#1d2740; color:#cfe0ff; font-size:15px; border-left:3px solid var(--accent); }
  .drill .en { font-weight:600; font-size:16px; }
  .drill .uk { color:var(--muted); font-size:13px; margin-top:4px; }
  .drill .acts { margin-top:8px; display:flex; gap:8px; }
  .drill .acts button { background:#2b3a5c; border-color:#3a4d78; font-size:13px; padding:6px 10px; }
  .drill button.spk, .drill button.drillrec { background:#2b3a5c; border:1px solid #3a4d78; border-radius:6px; color:#cfe0ff; font-size:13px; padding:4px 10px; margin-left:8px; cursor:pointer; }
  .drill button.spk:hover, .drill button.drillrec:hover { border-color:var(--accent); }
  .drill button.busy { opacity:.5; }
  #handsfree { background:#222633; }
  #handsfree.on { background:#16301f; color:var(--ok); border-color:var(--ok); }
  #mic.rec { box-shadow:0 0 0 6px rgba(229,72,77,.18); }
  .spk { background:#222633; border:1px solid #323848; border-radius:6px; padding:1px 7px; margin-left:8px; font-size:13px; cursor:pointer; }
  .spk:hover { border-color:var(--accent); }
  .spk.busy { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>🗣 MiraSpeak</h1>
  <nav class="tabs">
    <button id="tab-chat" class="active" onclick="showTab('chat')">💬 Чат</button>
    <button id="tab-learn" onclick="showTab('learn')">📚 Навчання</button>
  </nav>
  <label class="chat-only">Рівень <select id="level">
    <option>A1</option><option>A2</option><option selected>B1</option>
    <option>B2</option><option>C1</option><option>C2</option>
  </select></label>
  <label class="chat-only">Сценарій <select id="scenario"></select></label>
  <label class="chat-only" title="Тьютор — англійською. Коуч — українською + дрили на вимову.">Режим
    <select id="mode">
      <option value="tutor" selected>🎓 Тьютор (англ.)</option>
      <option value="coach">🧑‍🏫 Коуч (укр.)</option>
    </select></label>
  <button id="handsfree" class="chat-only" title="Безкнопкова розмова: Mira сама слухає після кожної відповіді">🎧 Hands-Free: OFF</button>
  <span id="status">Завантаження…</span>
</header>

<div id="chat"></div>

<div id="learn">
  <div id="learn-home">
    <div class="stats" id="learn-stats">Завантаження прогресу…</div>
    <div class="unit-grid" id="unit-grid"></div>
  </div>
  <div class="lesson" id="lesson" style="display:none"></div>
  <div class="lesson" id="quiz" style="display:none"></div>
</div>

<footer class="chat-only">
  <button id="mic" title="Натисни й говори">🎙</button>
  <div id="vuwrap" title="Рівень мікрофона"><div id="vubar"></div><span id="vutxt">—</span></div>
  <input id="text" placeholder="Або напиши англійською… (Enter — надіслати)">
  <button id="send">Надіслати</button>
</footer>
<script>
const chatEl = document.getElementById('chat');
const statusEl = document.getElementById('status');
const levelEl = document.getElementById('level');
const scenarioEl = document.getElementById('scenario');
const micBtn = document.getElementById('mic');
const textEl = document.getElementById('text');
const modeEl = document.getElementById('mode');
const handsFreeBtn = document.getElementById('handsfree');
let history = [];          // [{role, content}] для LLM
let recorder = null, chunks = [], busy = false;
let handsFree = false;     // безкнопковий режим: автозапуск мікрофона після відповіді Mira
let lastAudio = null;      // поточний відтворюваний Audio (щоб знати, коли закінчиться)
let currentDrill = null;   // останній дрил (англ. фраза), який треба повторити
let pendingDrill = null;   // якщо запис іде саме для дрилу — передамо фразу в /api/voice

// --- синтез довільного тексту (лексика/фрази у картках, дрили) ---
let _lastSpk = null;
async function speakText(text, lang, btn) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  if (_lastSpk) { try { _lastSpk.pause(); } catch (e) {} }
  try {
    const r = await fetch('/api/tts', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, lang})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const d = await r.json();
    const a = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
    _lastSpk = a;
    a.onended = () => { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } };
    await a.play().catch(() => {});
  } catch (e) {
    addMsg('err', 'Не вдалося озвучити: ' + e.message);
  } finally {
    setTimeout(() => { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } }, 300);
  }
}

// --- метадані (рівні, сценарії) ---
fetch('/api/meta').then(r => r.json()).then(m => {
  scenarioEl.innerHTML = m.scenarios.map(s => `<option value="${s.id}">${s.id}</option>`).join('');
  statusEl.textContent = `Готово · ${m.llm_provider} · ${m.profile}`;
}).catch(() => statusEl.textContent = 'Сервер недоступний');

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}

function playB64(b64, onEnd) {
  if (!b64) { if (onEnd) onEnd(); return; }
  const a = new Audio('data:audio/mpeg;base64,' + b64);
  lastAudio = a;
  a.onended = () => { if (onEnd) onEnd(); };
  a.onerror = () => { if (onEnd) onEnd(); };
  a.play().catch(() => { if (onEnd) onEnd(); });
}

function handleReply(data, transcript) {
  const mode = modeEl.value;
  if (transcript) { addMsg('user', transcript); history.push({role:'user', content: transcript}); }
  if (data.reply_spoken || data.reply_text) {
    addMsg('mira', data.reply_spoken || data.reply_text);
    history.push({role:'assistant', content: data.reply_text});
  }
  if (data.correction) addMsg('corr', data.correction);

  // --- ДРИЛ (коуч-режим): кнопка «Повторити за мною» + 🔊 ---
  if (data.drill && data.drill.en) {
    currentDrill = data.drill.en;   // запам'ятовуємо, яку фразу просили повторити
    const d = document.createElement('div');
    d.className = 'msg drill';
    const en = document.createElement('div');
    en.className = 'en'; en.textContent = '🎯 ' + data.drill.en;
    d.appendChild(en);
    if (data.drill.uk) {
      const uk = document.createElement('div');
      uk.className = 'uk'; uk.textContent = data.drill.uk;
      d.appendChild(uk);
    }
    const acts = document.createElement('div');
    acts.className = 'acts';
    const spk = document.createElement('button');
    spk.className = 'spk'; spk.textContent = '🔊 Послухати'; spk.title = 'Прослухати зразок';
    spk.setAttribute('data-en', data.drill.en);   // обробляється глобальним делегатором
    spk.setAttribute('data-lang', 'en');
    const rec = document.createElement('button');
    rec.className = 'drillrec'; rec.textContent = '🎙 Повторити'; rec.title = 'Записати свою вимову для оцінки';
    rec.onclick = () => {
      if (busy) return;
      pendingDrill = data.drill.en;   // наступний запис буде «перевіркою» цієї фрази
      addMsg('err', 'Запиши свою вимову фрази — коуч порівняє зі зразком.');
      startRec();
    };
    acts.appendChild(spk); acts.appendChild(rec);
    d.appendChild(acts);
    chatEl.appendChild(d);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  // Озвучення: спершу відповідь Mira, потім (у коуч-режимі) англійський дрил.
  const after = () => {
    if (handsFree) {
      statusEl.textContent = '🎙 Говори… (hands-free)';
      setTimeout(() => { if (handsFree && !busy) micBtn.click(); }, 350);
    }
  };
  if (data.drill_audio_b64) {
    playB64(data.audio_b64, () => playB64(data.drill_audio_b64, after));
  } else {
    playB64(data.audio_b64, after);
  }
}
async function sendText() {
  const t = textEl.value.trim();
  if (!t || busy) return;
  textEl.value = '';
  busy = true; statusEl.textContent = 'Mira думає…';
  const sentHistory = history.slice();
  try {
    const r = await fetch('/api/text', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: t, level: levelEl.value, scenario: scenarioEl.value,
                            mode: modeEl.value, history: sentHistory})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const data = await r.json();
    addMsg('user', t);
    history.push({role:'user', content: t});
    handleReply(data, null);
  } catch (e) {
    addMsg('err', 'Помилка: ' + e.message);
  } finally {
    busy = false; if (!handsFree) statusEl.textContent = 'Готово';
  }
}

// --- мікрофон: VAD на паузі тиші (авто-стоп) + ручний стоп кнопкою ---
const vubar = document.getElementById('vubar');
const vutxt = document.getElementById('vutxt');
const SILENCE_MS = 1600;   // пауза тиші => вважаємо фразу завершеною
const MIN_SPEECH_MS = 400; // мін. тривалість мовлення (щоб не ловити самий клік/шум)
const MAX_REC_MS = 20000;  // страховочний максимум довжини запису
const SPEECH_THR = 6;      // % рівня мікрофона, вище якого вважаємо за «звук»
let audioCtx = null, meterRaf = null, maxTimer = null;

function setLevel(pct) {
  vubar.style.width = pct + '%';
  vutxt.textContent = pct > 3 ? Math.round(pct) + '%' : '—';
}

async function startRec() {
  if (busy) return;
  // ручний стоп: якщо вже пишемо — зупиняємо
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const track = stream.getAudioTracks()[0];
    console.log('mic device:', track.label, '| enabled:', track.enabled);
    chunks = [];

    // --- індикатор рівня + детектор паузи тиші (VAD) ---
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    let spokeMs = 0, silenceMs = 0, started = false;
    (function meter() {
      analyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
      const pct = Math.round((peak / 128) * 100);
      setLevel(pct);
      if (pct >= SPEECH_THR) { spokeMs += 16; silenceMs = 0; } else { silenceMs += 16; }
      if (!started && spokeMs >= MIN_SPEECH_MS) started = true;   // почули хоч трохи мовлення
      if (started && silenceMs >= SILENCE_MS && recorder && recorder.state === 'recording') {
        console.log('auto-stop: silence after speech');
        recorder.stop();
        return;
      }
      meterRaf = requestAnimationFrame(meter);
    })();

    recorder = new MediaRecorder(stream);
    recorder.mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      micBtn.classList.remove('rec');
      cancelAnimationFrame(meterRaf); setLevel(0);
      if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
      micBtn.textContent = '🎙';
      const blob = new Blob(chunks, {type: 'audio/webm'});
      console.log('recorded blob:', blob.size, 'bytes');
      if (blob.size < 500) { addMsg('err', 'Мікрофон не записав звук. Перевір дозвіл і пристрій вводу у системі.'); return; }
      await sendAudio(blob);
    };
    recorder.start();
    micBtn.classList.add('rec');
    micBtn.textContent = '⏹';
    statusEl.textContent = 'Запис… говори (авто-стоп після паузи, або натисни ⏹)';
    // страховочний максимум, щоб запис не висів нескінченно
    maxTimer = setTimeout(() => {
      if (recorder && recorder.state === 'recording') { console.log('auto-stop: max time'); recorder.stop(); }
    }, MAX_REC_MS);
  } catch (e) {
    addMsg('err', 'Немає доступу до мікрофона: ' + e.message + ' (перевір налаштування → Конфіденційність → Мікрофон)');
    console.error('getUserMedia error:', e);
  }
}

micBtn.onclick = () => startRec();

// --- Hands-free: безкнопкова розмова (автозапуск мікрофона після кожної відповіді Mira) ---
handsFreeBtn.onclick = () => {
  handsFree = !handsFree;
  handsFreeBtn.classList.toggle('on', handsFree);
  handsFreeBtn.textContent = handsFree ? '🎧 Hands-Free: УВІМК' : '🎧 Hands-Free';
  if (handsFree) {
    addMsg('err', 'Hands-Free увімкнено: говори, а після відповіді Mira мікрофон увімкнеться сам.');
    if (!busy && !(recorder && recorder.state === 'recording')) startRec();
  } else {
    statusEl.textContent = 'Готово';
  }
};

async function sendAudio(blob) {
  if (busy) return;
  busy = true; statusEl.textContent = 'Розпізнавання…';
  try {
    const fd = new FormData();
    fd.append('audio', blob, 'speech.webm');
    fd.append('language', 'auto');   // авто-визначення мови → розпізнає і українську, і англійську
    fd.append('mode', modeEl.value); // tutor | coach
    fd.append('level', levelEl.value);
    fd.append('scenario', scenarioEl.value);
    if (pendingDrill) { fd.append('drill_target', pendingDrill); pendingDrill = null; } // «перевірка» вимови
    const r = await fetch('/api/voice', {method: 'POST', body: fd});
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const data = await r.json();
    handleReply(data, data.transcript);
  } catch (e) {
    addMsg('err', 'Помилка: ' + e.message);
    if (handsFree) statusEl.textContent = '🎙 Натисни 🎙 або говори (помилка, повтор)';
  } finally {
    busy = false; if (!handsFree) statusEl.textContent = 'Готово';
  }
}


document.getElementById('send').onclick = sendText;

// Делегований 🔊: працює і в чаті (дрили), і в навчальних картках (лексика/фрази).
// Кнопки в картках перестворюються з innerHTML, тому він створюється на document.
document.addEventListener('click', e => {
  const btn = e.target.closest('button.spk');
  if (!btn) return;
  const text = btn.getAttribute('data-en');
  const lang = btn.getAttribute('data-lang') || 'en';
  if (text) speakText(text, lang, btn);
});
// ================= Навчання: план A1–A2, уроки, тести =================
function showTab(tab) {
  document.body.classList.toggle('learn', tab === 'learn');
  document.getElementById('chat').style.display = tab === 'chat' ? 'flex' : 'none';
  document.getElementById('learn').style.display = tab === 'learn' ? 'block' : 'none';
  document.getElementById('tab-chat').classList.toggle('active', tab === 'chat');
  document.getElementById('tab-learn').classList.toggle('active', tab === 'learn');
  if (tab === 'learn') loadLearnHome();
}

async function loadLearnHome() {
  document.getElementById('learn-home').style.display = 'block';
  document.getElementById('lesson').style.display = 'none';
  document.getElementById('quiz').style.display = 'none';
  const stats = document.getElementById('learn-stats');
  const grid = document.getElementById('unit-grid');
  stats.innerHTML = 'Завантаження прогресу…';
  try {
    const r = await fetch('/api/curriculum');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const p = data.progress || {};
    stats.innerHTML =
      '<div class="stat"><b>' + (p.units_completed || 0) + '</b>Юнітів пройдено</div>' +
      '<div class="stat"><b>' + (p.attempts || 0) + '</b>Спроб тестів</div>' +
      '<div class="stat"><b>' + (p.avg_score || 0) + '%</b>Середній бал</div>';
    const perUnit = p.units || {};
    grid.innerHTML = '';
    for (const u of data.units) {
      const pr = perUnit[u.id];
      let badge, cls;
      if (pr && pr.status === 'completed') { badge = '✅ ' + pr.best_score + '%'; cls = 'ok'; }
      else if (pr) { badge = '⏳ ' + pr.best_score + '%'; cls = 'prog'; }
      else { badge = 'Новий'; cls = 'new'; }
      const card = document.createElement('div');
      card.className = 'unit-card';
      card.innerHTML =
        '<div class="lv">' + u.level + ' · Юніт ' + u.order + '</div>' +
        '<div class="tt">' + u.title + '</div>' +
        '<div class="tuk">' + u.title_uk + '</div>' +
        '<div class="meta"><span class="badge ' + cls + '">' + badge + '</span>' +
        '<span class="tuk">📝 ' + u.quiz_count + ' питань</span></div>';
      card.onclick = () => openUnit(u.id);
      grid.appendChild(card);
    }
  } catch (e) {
    stats.innerHTML = '<div class="stat">Помилка завантаження: ' + e.message + '</div>';
  }
}

async function openUnit(unitId) {
  const home = document.getElementById('learn-home');
  const lesson = document.getElementById('lesson');
  const quiz = document.getElementById('quiz');
  home.style.display = 'none';
  quiz.style.display = 'none';
  lesson.style.display = 'block';
  lesson.innerHTML = '<p>Завантаження уроку…</p>';
  try {
    const r = await fetch('/api/curriculum/' + unitId);
    if (!r.ok) throw new Error(r.status);
    const u = await r.json();
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    const spkBtn = (en, lang) =>
      '<button class="spk" data-en="' + esc(en) + '" data-lang="' + lang + '" title="Прослухати">🔊</button>';
    const vocab = (u.vocabulary || []).map(v =>
      '<div class="vocab-row"><span>' + esc(v.en) + '</span><span class="u">' + esc(v.uk) + '</span>' + spkBtn(v.en, 'en') + '</div>').join('');
    const phrases = (u.phrases || []).map(f =>
      '<div class="vocab-row"><span>' + esc(f.en) + '</span><span class="u">' + esc(f.uk) + '</span>' + spkBtn(f.en, 'en') + '</div>').join('');
    const goals = (u.goals_uk || []).map(g => '<li>' + g + '</li>').join('');
    lesson.innerHTML =
      '<button class="backbtn" onclick="loadLearnHome()">← До списку юнітів</button>' +
      '<h2>' + u.title + '</h2>' +
      '<div class="sub">' + u.level + ' · ' + u.title_uk + '</div>' +
      '<h3>Цілі уроку</h3><div class="sec"><ul class="vlist">' + goals + '</ul></div>' +
      '<h3>Тема</h3><div class="sec">' + (u.topic_uk || u.topic || '') + '</div>' +
      '<h3>Граматика</h3><div class="sec">' + (u.grammar_uk || u.grammar || '') + '</div>' +
      '<h3>Лексика</h3><div class="sec">' + vocab + '</div>' +
      '<h3>Корисні фрази</h3><div class="sec">' + phrases + '</div>' +
      '<button class="backbtn" style="margin-top:10px" onclick="startQuiz(\'' + unitId + '\')">📝 Пройти тест →</button>';
    lesson.scrollTop = 0;
  } catch (e) {
    lesson.innerHTML = '<button class="backbtn" onclick="loadLearnHome()">← Назад</button><p class="res-bad">Помилка: ' + e.message + '</p>';
  }
}

async function startQuiz(unitId) {
  const lesson = document.getElementById('lesson');
  const quiz = document.getElementById('quiz');
  lesson.style.display = 'none';
  quiz.style.display = 'block';
  quiz.innerHTML = '<p>Завантаження тесту…</p>';
  try {
    const r = await fetch('/api/curriculum/' + unitId + '/quiz');
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    let html = '<button class="backbtn" onclick="openUnit(\'' + unitId + '\')">← До уроку</button>' +
      '<h2>Тест: ' + data.title_uk + '</h2>' +
      '<div class="sub">' + data.questions.length + ' питань · прохід від 80%</div>';
    data.questions.forEach((q, i) => {
      html += '<div class="qbox" data-qi="' + q.index + '" data-type="' + q.type + '"><div class="q">' + (i + 1) + '. ' + q.q + '</div>';
      if (q.type === 'mc') {
        q.options.forEach((opt, oi) => {
          html += '<label><input type="radio" name="q' + q.index + '" value="' + oi + '"> ' + opt + '</label>';
        });
      } else {
        html += '<input type="text" name="q' + q.index + '" placeholder="Введи відповідь…">';
      }
      html += '</div>';
    });
    html += '<button class="backbtn" onclick="submitQuiz(\'' + unitId + '\')">✅ Перевірити</button>';
    quiz.innerHTML = html;
    quiz.scrollTop = 0;
  } catch (e) {
    quiz.innerHTML = '<button class="backbtn" onclick="openUnit(\'' + unitId + '\')">← До уроку</button><p class="res-bad">Помилка: ' + e.message + '</p>';
  }
}

async function submitQuiz(unitId) {
  const quiz = document.getElementById('quiz');
  const qboxes = quiz.querySelectorAll('.qbox');
  const answers = [];
  qboxes.forEach(box => {
    const qi = parseInt(box.dataset.qi);
    const type = box.dataset.type;
    if (type === 'mc') {
      const checked = box.querySelector('input[type=radio]:checked');
      answers[qi] = checked ? parseInt(checked.value) : null;
    } else {
      const inp = box.querySelector('input[type=text]');
      answers[qi] = inp ? inp.value.trim() : '';
    }
  });
  try {
    const r = await fetch('/api/curriculum/' + unitId + '/grade', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({answers})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const res = await r.json();
    renderQuizResult(res);
  } catch (e) {
    quiz.innerHTML = '<p class="res-bad">Помилка: ' + e.message + '</p>';
  }
}

function renderQuizResult(res) {
  const quiz = document.getElementById('quiz');
  const passCls = res.passed ? 'res-ok' : 'res-bad';
  const passMsg = res.passed ? '✅ Пройдено!' : '❌ Спробуй ще раз (потрібно 80%)';
  let html = '<button class="backbtn" onclick="loadLearnHome()">← До списку юнітів</button>' +
    '<h2>Результат: ' + res.correct + '/' + res.total + '</h2>' +
    '<div class="sub ' + passCls + '" style="font-size:16px">' + res.score_percent + '% · ' + passMsg + '</div>';
  res.per_question.forEach((pq, i) => {
    const mark = pq.correct ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>';
    html += '<div class="qbox"><div class="q">' + mark + ' ' + (i + 1) + '. ' + pq.q + '</div>';
    if (!pq.correct) {
      let exp = pq.expected, giv = pq.given;
      if (pq.type === 'mc' && pq.options) { exp = pq.options[pq.expected]; giv = pq.options[pq.given] || '(немає відповіді)'; }
      html += '<div class="res-bad" style="font-size:13px">Твоя відповідь: ' + giv + ' · Правильно: <b>' + exp + '</b></div>';
    }
    if (pq.explain_uk) html += '<div class="explain">💡 ' + pq.explain_uk + '</div>';
    html += '</div>';
  });
  html += '<button class="backbtn" onclick="openUnit(\'' + res.unit_id + '\')">📖 До уроку</button>' +
    '<button class="backbtn" onclick="startQuiz(\'' + res.unit_id + '\')">🔁 Ще раз</button>';
  quiz.innerHTML = html;
  quiz.scrollTop = 0;
}

textEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
