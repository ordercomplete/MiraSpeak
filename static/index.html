<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiraSpeak — AI-тьютор англійської</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --accent:#4f8cff; --text:#e6e9ef; --muted:#8b93a7; --ok:#3ddc84; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 16px; background:var(--panel); display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-bottom:1px solid #232733; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  select, button { background:#222633; color:var(--text); border:1px solid #323848; border-radius:8px; padding:8px 12px; font-size:14px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  #status { margin-left:auto; color:var(--muted); font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.45; white-space:pre-wrap; word-wrap:break-word; }
  .user { align-self:flex-end; background:var(--accent); color:#fff; }
  .mira { align-self:flex-start; background:var(--panel); }
  .corr { align-self:flex-start; background:#20261f; color:var(--ok); font-size:14px; border-left:3px solid var(--ok); }
  .err  { align-self:center; background:#2a1c1c; color:#ff8080; font-size:13px; }
  footer { padding:12px 16px; background:var(--panel); border-top:1px solid #232733; display:flex; gap:10px; align-items:center; }
  #mic { width:56px; height:56px; border-radius:50%; font-size:22px; background:var(--accent); border:none; }
  #mic.rec { background:#e5484d; animation:pulse 1s infinite; }
  @keyframes pulse { 50% { transform:scale(1.08); } }
  #stop { width:56px; height:56px; border-radius:50%; font-size:22px; background:#222633; border:1px solid #323848; }
  #stop:hover { border-color:#e5484d; }
  #text { flex:1; padding:12px 14px; border-radius:24px; border:1px solid #323848; background:#222633; color:var(--text); font-size:15px; }
  #vuwrap { width:120px; height:14px; background:#222633; border:1px solid #323848; border-radius:7px; position:relative; overflow:hidden; display:flex; align-items:center; }
  #vubar { height:100%; width:0%; background:linear-gradient(90deg,#3ddc84,#ffd166,#e5484d); transition:width .08s linear; }
  #vutxt { position:absolute; right:6px; top:0; line-height:14px; font-size:10px; color:var(--muted); }
  nav.tabs { display:flex; gap:6px; margin-left:8px; }
  nav.tabs button { background:transparent; border:1px solid transparent; color:var(--muted); padding:6px 12px; border-radius:8px; font-size:14px; }
  nav.tabs button.active { color:var(--text); background:#222633; border-color:#323848; }
  body.learn .chat-only { display:none !important; }
  /* --- Панель налаштувань --- */
  #settingsbtn { background:transparent; border:1px solid transparent; font-size:17px; padding:6px 10px; }
  #settingsbtn:hover { border-color:var(--accent); }
  #settingspanel { position:fixed; top:64px; right:16px; z-index:50; width:320px;
    background:var(--panel); border:1px solid #323848; border-radius:12px; padding:14px;
    box-shadow:0 12px 40px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:12px; }
  .set-title { font-weight:600; font-size:15px; }
  .set-row { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .set-row select, .set-row input[type=range] { flex:1; }
  .set-row input[type=range] { accent-color:var(--accent); }
  .set-row textarea { flex:1; font-family:inherit; font-size:12px; resize:vertical; }
  .sess-del { color:var(--muted); font-size:12px; padding:2px 6px; border-radius:6px; margin-left:auto; border:1px solid transparent; background:transparent; cursor:pointer; }
  .sess-del:hover { color:#ff8080; border-color:#ff8080; }
  #learn { flex:1; overflow-y:auto; padding:16px; display:none; }
  .unit-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; max-width:1000px; margin:0 auto; }
  .unit-card { background:var(--panel); border:1px solid #232733; border-radius:12px; padding:14px; cursor:pointer; transition:border-color .12s; }
  .unit-card:hover { border-color:var(--accent); }
  .unit-card .lv { font-size:11px; color:var(--muted); letter-spacing:.5px; }
  .unit-card .tt { font-weight:600; margin:5px 0 2px; font-size:15px; }
  .unit-card .tuk { color:var(--muted); font-size:13px; }
  .unit-card .meta { margin-top:10px; display:flex; align-items:center; gap:8px; }
  .badge { display:inline-block; font-size:11px; padding:2px 8px; border-radius:10px; }
  .badge.ok { background:#16301f; color:var(--ok); }
  .badge.prog { background:#2e2a16; color:#ffd166; }
  .badge.new { background:#222633; color:var(--muted); }
  .stats { max-width:1000px; margin:0 auto 14px; display:flex; gap:10px; flex-wrap:wrap; }
  .stat { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:10px 14px; font-size:13px; color:var(--muted); }
  .stat b { color:var(--text); font-size:18px; display:block; }
  .lesson { max-width:720px; margin:0 auto; }
  .lesson h2 { margin:0 0 2px; }
  .lesson .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  .lesson h3 { font-size:14px; color:var(--accent); margin:18px 0 8px; text-transform:uppercase; letter-spacing:.4px; }
  .lesson .sec { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:12px 14px; margin-bottom:12px; line-height:1.6; }
  .vlist { margin:0; padding-left:18px; }
  .vocab-row { display:flex; justify-content:space-between; gap:10px; padding:5px 0; border-bottom:1px solid #1e222c; }
  .vocab-row:last-child { border-bottom:none; }
  .vocab-row .u { color:var(--muted); }
  .backbtn { background:#222633; color:var(--text); border:1px solid #323848; border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; margin-bottom:14px; }
  .qbox { background:var(--panel); border:1px solid #232733; border-radius:10px; padding:14px; margin-bottom:12px; }
  .qbox .q { font-weight:600; margin-bottom:10px; line-height:1.5; }
  .qbox label { display:block; padding:8px 10px; border:1px solid #323848; border-radius:8px; margin:6px 0; cursor:pointer; font-size:14px; }
  .qbox label:hover { border-color:var(--accent); }
  .qbox input[type=text] { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #323848; background:#222633; color:var(--text); font-size:14px; }
  .res-ok { color:var(--ok); } .res-bad { color:#ff8080; }
  .explain { font-size:13px; color:var(--muted); margin-top:8px; padding:8px 10px; background:#1a1e26; border-radius:8px; }
  .drill { align-self:flex-start; background:#1d2740; color:#cfe0ff; font-size:15px; border-left:3px solid var(--accent); }
  .drill .en { font-weight:600; font-size:16px; }
  .drill .uk { color:var(--muted); font-size:13px; margin-top:4px; }
  .drill .acts { margin-top:8px; display:flex; gap:8px; }
  .drill .acts button { background:#2b3a5c; border-color:#3a4d78; font-size:13px; padding:6px 10px; }
  .drill button.spk, .drill button.drillrec { background:#2b3a5c; border:1px solid #3a4d78; border-radius:6px; color:#cfe0ff; font-size:13px; padding:4px 10px; margin-left:8px; cursor:pointer; }
  .drill button.spk:hover, .drill button.drillrec:hover { border-color:var(--accent); }
  .drill button.busy { opacity:.5; }
  #handsfree { background:#222633; }
  #handsfree.on { background:#16301f; color:var(--ok); border-color:var(--ok); }
  #mic.rec { box-shadow:0 0 0 6px rgba(229,72,77,.18); }
  .spk { background:#222633; border:1px solid #323848; border-radius:6px; padding:1px 7px; margin-left:8px; font-size:13px; cursor:pointer; }
  .spk:hover { border-color:var(--accent); }
  .spk.busy { opacity:.5; }
  /* --- Сайдбар історії чатів --- */
  #wrap { flex:1; display:flex; min-height:0; }
  #sidebar { width:250px; background:var(--panel); border-right:1px solid #232733; display:flex; flex-direction:column; }
  #sidebar .side-head { padding:10px 12px; display:flex; gap:8px; align-items:center; }
  #newchat { flex:1; }
  #sesslist { flex:1; overflow-y:auto; padding:0 8px 12px; display:flex; flex-direction:column; gap:6px; }
  .sess { text-align:left; background:transparent; border:1px solid transparent; border-radius:8px; padding:8px 10px; font-size:13px; cursor:pointer; color:var(--text); }
  .sess:hover { border-color:var(--accent); }
  .sess.active { background:#222633; border-color:#323848; }
  .sess .st { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sess .sm { color:var(--muted); font-size:11px; margin-top:2px; }
  #chatcol { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chatcol #chat { flex:1; }
  body.learn #sidebar { display:none; }
</style>
</head>
<body>
<header>
  <h1>🗣 MiraSpeak</h1>
  <nav class="tabs">
    <button id="tab-chat" class="active" onclick="showTab('chat')">💬 Чат</button>
    <button id="tab-learn" onclick="showTab('learn')">📚 Навчання</button>
  </nav>
  <label class="chat-only">Рівень <select id="level">
    <option>A1</option><option>A2</option><option selected>B1</option>
    <option>B2</option><option>C1</option><option>C2</option>
  </select></label>
  <label class="chat-only">Сценарій <select id="scenario"></select></label>
  <label class="chat-only" title="Тьютор — англійською. Коуч — українською + дрили на вимову.">Режим
    <select id="mode">
      <option value="tutor" selected>🎓 Тьютор (англ.)</option>
      <option value="coach">🧑‍🏫 Коуч (укр.)</option>
      <option value="mixed">🌐 Змішаний (в цільовій мові)</option>
    </select></label>
<label class="chat-only">Мова вивчення <select id="targetlang"><option value="en" selected>англійська</option></select></label>
  <button id="handsfree" class="chat-only" title="Безкнопкова розмова: Mira сама слухає після кожної відповіді">🎧 Hands-Free: OFF</button>
  <button id="settingsbtn" title="Налаштування (голос, швидкість)">⚙</button>
  <span id="status">Завантаження…</span>
  <span id="ailabel" title="Голос Mira згенеровано штучним інтелектом (Supertonic 3, ліцензія OpenRAIL-M)" style="font-size:11px;color:var(--muted)">🤖 AI-голос</span>
</header>

<div id="settingspanel" style="display:none">
  <div class="set-title">⚙ Налаштування</div>
  <label class="set-row">Голос Mira
    <select id="set-voice"></select>
    <button id="set-testvoice" title="Прослухати обраний голос">🔊</button>
  </label>
  <label class="set-row">Швидкість мови
    <input type="range" id="set-speed" min="0.6" max="1.6" step="0.05" value="1.05">
    <span id="set-speedval" style="min-width:38px;text-align:right">1.05</span>
  </label>
  <label class="set-row">Двигун TTS
    <select id="set-provider"></select>
  </label>
  <label class="set-row">Мова вивчення
    <select id="set-target-lang"></select>
  </label>
  <label class="set-row">Рівень за замовч.
    <select id="set-default-level"></select>
  </label>
  <label class="set-row">Сценарій за замовд.
    <select id="set-default-scenario"></select>
  </label>
  <label class="set-row">Режим за замовд.
    <select id="set-default-mode"></select>
  </label>
  <label class="set-row">Шаблон коуча
    <textarea id="set-coach-template" rows="6" placeholder="Текст системного промпту коуча…"></textarea>
  </label>
  <div class="set-row" style="justify-content:flex-end;gap:8px">
    <button id="set-close">Закрити</button>
    <button id="set-save" style="background:var(--accent);border-color:var(--accent)">Зберегти</button>
  </div>
  <div id="set-msg" style="font-size:12px;color:var(--ok);min-height:16px"></div>
</div>

<div id="wrap">
  <aside id="sidebar" class="chat-only">
    <div class="side-head"><button id="newchat" title="Почати новий чат">＋ Новий чат</button></div>
    <div id="sesslist"></div>
  </aside>
  <div id="chatcol">
    <div id="chat"></div>
  </div>
</div>

<div id="learn">
  <div id="learn-home">
    <div class="stats" id="learn-stats">Завантаження прогресу…</div>
    <div class="unit-grid" id="unit-grid"></div>
  </div>
  <div class="lesson" id="lesson" style="display:none"></div>
  <div class="lesson" id="quiz" style="display:none"></div>
</div>

<footer class="chat-only">
  <button id="mic" title="Натисни й говори">🎙</button>
  <button id="stop" title="Зупинити вимову Mira">⏹</button>
  <div id="vuwrap" title="Рівень мікрофона"><div id="vubar"></div><span id="vutxt">—</span></div>
  <input id="text" placeholder="Або напиши англійською… (Enter — надіслати)">
  <button id="send">Надіслати</button>
</footer>
<script>
const chatEl = document.getElementById('chat');
const statusEl = document.getElementById('status');
const levelEl = document.getElementById('level');
const scenarioEl = document.getElementById('scenario');
const micBtn = document.getElementById('mic');
const textEl = document.getElementById('text');
const modeEl = document.getElementById('mode');
const targetLangEl = document.getElementById('targetlang');
const setTargetLang = document.getElementById('set-target-lang');
const setDefaultLevel = document.getElementById('set-default-level');
const setDefaultScenario = document.getElementById('set-default-scenario');
const setDefaultMode = document.getElementById('set-default-mode');
const setCoachTemplate = document.getElementById('set-coach-template');
const handsFreeBtn = document.getElementById('handsfree');
let history = [];          // [{role, content}] для LLM
let recorder = null, chunks = [], busy = false;
let sessionId = 0;           // автосесія бекенда: повертається кожним ходом, продовжує чат
let handsFree = false;     // безкнопковий режим: автозапуск мікрофона після відповіді Mira
let lastAudio = null;      // поточний відтворюваний Audio (щоб знати, коли закінчиться)
let currentDrill = null;   // останній дрил (англ. фраза), який треба повторити
let pendingDrill = null;   // якщо запис іде саме для дрилу — передамо фразу в /api/voice

function savePageState() {
  try {
    localStorage.setItem('miraspeak_page', JSON.stringify({
      level: levelEl.value, scenario: scenarioEl.value, mode: modeEl.value,
      target_lang: targetLangEl.value, session_id: sessionId || 0,
      history: history.slice(-50),
    }));
  } catch (e) {}
}
async function restorePageState() {
  try {
    const raw = localStorage.getItem('miraspeak_page');
    if (!raw) { return false; }
    const st = JSON.parse(raw);
    if (st.level)  { levelEl.value  = st.level; }
    if (st.scenario) { scenarioEl.value = st.scenario; }
    if (st.mode)     { modeEl.value     = st.mode; }
    if (st.target_lang) { targetLangEl.value = st.target_lang; }
    if (st.session_id) {
      sessionId = st.session_id;
      await openSession(st.session_id);
      return true;
    }
    if (st.history && st.history.length) {
      history = st.history.slice();
      chatEl.innerHTML = '';
      st.history.forEach(m => addMsg(m.role === 'user' ? 'user' : 'mira', m.content));
    }
    return true;
  } catch (e) { return false; }
}

// --- синтез довільного тексту (лексика/фрази у картках, дрили) ---
let _lastSpk = null;
let speechStopped = false;   // ⏹ зупиняє поточну вимову і hands-free ланцюжок
function stopSpeech() {
  speechStopped = true;
  try { if (lastAudio) { lastAudio.pause(); lastAudio.currentTime = 0; } } catch (e) {}
  try { if (_lastSpk) { _lastSpk.pause(); _lastSpk.currentTime = 0; } } catch (e) {}
  lastAudio = null; _lastSpk = null;
  if (handsFree) statusEl.textContent = '⏹ Зупинено (hands-free вимкнено)';
  handsFree = false; handsFreeBtn.textContent = '🎧 Hands-Free: OFF'; handsFreeBtn.classList.remove('on');
}
document.getElementById('stop').onclick = () => { stopSpeech(); };
async function speakText(text, lang, btn) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  if (_lastSpk) { try { _lastSpk.pause(); } catch (e) {} }
  try {
    const r = await fetch('/api/tts', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text, lang})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const d = await r.json();
    const a = new Audio('data:audio/mpeg;base64,' + d.audio_b64);
    _lastSpk = a;
    a.onended = () => { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } };
    await a.play().catch(() => {});
  } catch (e) {
    addMsg('err', 'Не вдалося озвучити: ' + e.message);
  } finally {
    setTimeout(() => { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } }, 300);
  }
}

// --- метадані (рівні, сценарії) ---
fetch('/api/meta').then(r => r.json()).then(async m => {
  scenarioEl.innerHTML = m.scenarios.map(s => `<option value="${s.id}">${s.id}</option>`).join('');
  if (m.target_languages) {
    targetLangEl.innerHTML = m.target_languages.map(l => `<option value="${l.code}" ${l.code==='en'?'selected':''}>${l.name_uk} (${l.name_en})</option>`).join('');
  }
  statusEl.textContent = `Готово · ${m.llm_provider} · ${m.profile}`;
  loadSessions();   // показати збережені чати зліва
  if (!(await restorePageState())) {
    addMsg('mira', "Hi! I'm Mira, your English tutor 🌸 Choose your level and scenario, then press the mic or just type. Якщо треба пояснення українською — напишіть «поясни».");
  }
}).catch(() => statusEl.textContent = 'Сервер недоступний');

function addMsg(cls, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.textContent = text;
  chatEl.appendChild(d);
  chatEl.scrollTop = chatEl.scrollHeight;
  return d;
}

// --- Сайдбар: список збережених чатів, відкриття історії, новий чат ---
const sessListEl = document.getElementById('sesslist');
function renderSessions(items) {
  sessListEl.innerHTML = '';
  (items || []).forEach(s => {
    const b = document.createElement('button');
    b.className = 'sess' + (s.id === sessionId ? ' active' : '');
    const title = document.createElement('div');
    title.className = 'st';
    title.textContent = (s.scenario || 'чат') + ' · ' + (s.level || '');
    const meta = document.createElement('div');
    meta.className = 'sm';
    meta.textContent = (s.started_at || '').slice(0, 16).replace('T', ' ') + ' · ' + (s.turns || 0) + ' реплік';
    b.appendChild(title); b.appendChild(meta);
    const del = document.createElement('button');
    del.className = 'sess-del';
    del.title = 'Видалити чат';
    del.textContent = '🗑';
    del.onclick = (e) => { e.stopPropagation(); deleteSession(s.id); };
    b.appendChild(del);
    b.onclick = () => openSession(s.id);
    sessListEl.appendChild(b);
  });
}
async function loadSessions() {
  try {
    const r = await fetch('/api/sessions?limit=20');
    if (r.ok) renderSessions((await r.json()).sessions);
  } catch (e) { /* сайдбар не блокує чат */ }
}
async function deleteSession(id) {
  if (!confirm('Видалити цей чат і всю його історію без можливості відновлення?')) return;
  try {
    const r = await fetch('/api/sessions/' + id, { method: 'DELETE' });
    if (!r.ok) throw new Error(r.status);
    if (sessionId === id) {
      sessionId = 0; history = []; chatEl.innerHTML = '';
      addMsg('mira', 'Чат видалено. Натисніть «＋ Новий чат» або просто напишіть.');
    }
    loadSessions();
    savePageState();
  } catch (e) { addMsg('err', 'Не вдалося видалити чат: ' + e.message); }
}

async function openSession(id) {
  try {
    const r = await fetch('/api/sessions/' + id + '?limit=100');
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    sessionId = id; history = []; chatEl.innerHTML = '';
    (d.messages || []).forEach(m => {
      if (m.role === 'user') { addMsg('user', m.content); history.push({role:'user', content: m.content}); }
      else { addMsg('mira', m.content); history.push({role:'assistant', content: m.content}); }
    });
    loadSessions();
    savePageState();
  } catch (e) { addMsg('err', 'Не вдалося відкрити чат: ' + e.message); }
}
document.getElementById('newchat').onclick = () => {
  sessionId = 0; history = []; chatEl.innerHTML = '';
  addMsg('mira', "Новий чат 🌸 Говори або пиши — я все збережу.");
  loadSessions();
  savePageState();
};

function playB64(b64, onEnd, mime) {
  if (!b64) { if (onEnd) onEnd(); return; }
  if (speechStopped) { speechStopped = false; return; }   // ⏹: не стартувати нове
  const a = new Audio('data:' + (mime || 'audio/mpeg') + ';base64,' + b64);
  lastAudio = a;
  a.onended = () => { if (speechStopped) { speechStopped = false; return; } if (onEnd) onEnd(); };
  a.onerror = () => { if (onEnd) onEnd(); };
  a.play().catch(() => { if (onEnd) onEnd(); });
}

// --- мікрофон: VAD на паузі тиші (авто-стоп) + ручний стоп кнопкою ---
const vubar = document.getElementById('vubar');
const vutxt = document.getElementById('vutxt');
const SILENCE_MS = 1600;   // пауза тиші => вважаємо фразу завершеною
const MIN_SPEECH_MS = 400; // мін. тривалість мовлення (щоб не ловити самий клік/шум)
const MAX_REC_MS = 20000;  // страховочний максимум довжини запису
const SPEECH_THR = 6;      // % рівня мікрофона, вище якого вважаємо за «звук»
let audioCtx = null, meterRaf = null, maxTimer = null;

function setLevel(pct) {
  vubar.style.width = pct + '%';
  vutxt.textContent = pct > 3 ? Math.round(pct) + '%' : '—';
}

async function startRec() {
  if (busy) return;
  // ручний стоп: якщо вже пишемо — зупиняємо
  if (recorder && recorder.state === 'recording') { recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({audio: true});
    const track = stream.getAudioTracks()[0];
    console.log('mic device:', track.label, '| enabled:', track.enabled);
    chunks = [];

    // --- індикатор рівня + детектор паузи тиші (VAD) ---
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const src = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    src.connect(analyser);
    const buf = new Uint8Array(analyser.frequencyBinCount);
    let spokeMs = 0, silenceMs = 0, started = false;
    (function meter() {
      analyser.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i = 0; i < buf.length; i++) peak = Math.max(peak, Math.abs(buf[i] - 128));
      const pct = Math.round((peak / 128) * 100);
      setLevel(pct);
      if (pct >= SPEECH_THR) { spokeMs += 16; silenceMs = 0; } else { silenceMs += 16; }
      if (!started && spokeMs >= MIN_SPEECH_MS) started = true;   // почули хоч трохи мовлення
      if (started && silenceMs >= SILENCE_MS && recorder && recorder.state === 'recording') {
        console.log('auto-stop: silence after speech');
        recorder.stop();
        return;
      }
      meterRaf = requestAnimationFrame(meter);
    })();

    recorder = new MediaRecorder(stream);
    recorder.mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : '';
    recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      micBtn.classList.remove('rec');
      cancelAnimationFrame(meterRaf); setLevel(0);
      if (maxTimer) { clearTimeout(maxTimer); maxTimer = null; }
      micBtn.textContent = '🎙';
      const blob = new Blob(chunks, {type: 'audio/webm'});
      console.log('recorded blob:', blob.size, 'bytes');
      if (blob.size < 500) { addMsg('err', 'Мікрофон не записав звук. Перевір дозвіл і пристрій вводу у системі.'); return; }
      await sendAudio(blob);
    };
    recorder.start();
    micBtn.classList.add('rec');
    micBtn.textContent = '⏹';
    statusEl.textContent = 'Запис… говори (авто-стоп після паузи, або натисни ⏹)';
    // страховочний максимум, щоб запис не висів нескінченно
    maxTimer = setTimeout(() => {
      if (recorder && recorder.state === 'recording') { console.log('auto-stop: max time'); recorder.stop(); }
    }, MAX_REC_MS);
  } catch (e) {
    addMsg('err', 'Немає доступу до мікрофона: ' + e.message + ' (перевір налаштування → Конфіденційність → Мікрофон)');
    console.error('getUserMedia error:', e);
  }
}

async function sendAudio(blob) {
  if (busy) return;
  busy = true; statusEl.textContent = 'Розпізнавання…';
  try {
    const fd = new FormData();
    fd.append('audio', blob, 'speech.webm');
    fd.append('language', 'auto');   // авто-визначення мови → розпізнає і українську, і англійську
    fd.append('mode', modeEl.value); // tutor | coach
    fd.append('target_lang', targetLangEl.value);
    fd.append('level', levelEl.value);
    fd.append('scenario', scenarioEl.value);
    if (pendingDrill) { fd.append('drill_target', pendingDrill); pendingDrill = null; } // «перевірка» вимови
    if (sessionId) fd.append('session_id', sessionId);   // продовжити поточний чат
    const r = await fetch('/api/voice', {method: 'POST', body: fd});
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const data = await r.json();
    if (data.session_id) sessionId = data.session_id;
    loadSessions();
    handleReply(data, data.transcript);
    savePageState();

    addMsg('err', 'Помилка: ' + e.message);
    if (handsFree) statusEl.textContent = '🎙 Натисни 🎙 або говори (помилка, повтор)';
  } finally {
    busy = false; if (!handsFree) statusEl.textContent = 'Готово';
  }
}

async function submitQuiz(unitId) {
  const quiz = document.getElementById('quiz');
  const qboxes = quiz.querySelectorAll('.qbox');
  const answers = [];
  qboxes.forEach(box => {
    const qi = parseInt(box.dataset.qi);
    const type = box.dataset.type;
    if (type === 'mc') {
      const checked = box.querySelector('input[type=radio]:checked');
      answers[qi] = checked ? parseInt(checked.value) : null;
    } else {
      const inp = box.querySelector('input[type=text]');
      answers[qi] = inp ? inp.value.trim() : '';
    }
  });
  try {
    const r = await fetch('/api/curriculum/' + unitId + '/grade', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({answers})
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const res = await r.json();
    renderQuizResult(res);
  } catch (e) {
    quiz.innerHTML = '<p class="res-bad">Помилка: ' + e.message + '</p>';
  }
}

function renderQuizResult(res) {
  const quiz = document.getElementById('quiz');
  const passCls = res.passed ? 'res-ok' : 'res-bad';
  const passMsg = res.passed ? '✅ Пройдено!' : '❌ Спробуй ще раз (потрібно 80%)';
  let html = '<button class="backbtn" onclick="loadLearnHome()">← До списку юнітів</button>' +
    '<h2>Результат: ' + res.correct + '/' + res.total + '</h2>' +
    '<div class="sub ' + passCls + '" style="font-size:16px">' + res.score_percent + '% · ' + passMsg + '</div>';
  res.per_question.forEach((pq, i) => {
    const mark = pq.correct ? '<span class="res-ok">✔</span>' : '<span class="res-bad">✘</span>';
    html += '<div class="qbox"><div class="q">' + mark + ' ' + (i + 1) + '. ' + pq.q + '</div>';
    if (!pq.correct) {
      let exp = pq.expected, giv = pq.given;
      if (pq.type === 'mc' && pq.options) { exp = pq.options[pq.expected]; giv = pq.options[pq.given] || '(немає відповіді)'; }
      html += '<div class="res-bad" style="font-size:13px">Твоя відповідь: ' + giv + ' · Правильно: <b>' + exp + '</b></div>';
    }
    if (pq.explain_uk) html += '<div class="explain">💡 ' + pq.explain_uk + '</div>';
    html += '</div>';
  });
  html += '<button class="backbtn" onclick="openUnit(\'' + res.unit_id + '\')">📖 До уроку</button>' +
    '<button class="backbtn" onclick="startQuiz(\'' + res.unit_id + '\')">🔁 Ще раз</button>';
  quiz.innerHTML = html;
  quiz.scrollTop = 0;
}

    setTargetLang.innerHTML = d.target_languages.map(l =>
      '<option value="' + l.code + '"' + (l.code === s.default_target_lang ? ' selected' : '') + '>' + l.name_uk + ' (' + l.name_en + ')' + '</option>').join('');
    setDefaultLevel.innerHTML = d.levels.map(lv =>
      '<option value="' + lv + '"' + (lv === s.default_level ? ' selected' : '') + '>' + lv + '</option>').join('');
    setDefaultScenario.innerHTML = d.scenarios.map(sc =>
      '<option value="' + sc.id + '"' + (sc.id === s.default_scenario ? ' selected' : '') + '>' + sc.id + '</option>').join('');
    setDefaultMode.innerHTML = d.modes.map(m =>
      '<option value="' + m + '"' + (m === s.default_mode ? ' selected' : '') + '>' + (m === 'mixed' ? '🌐 Змішаний' : m === 'tutor' ? '🎓 Тьютор' : '🧑‍🏫 Коуч') + '</option>').join('');
    setCoachTemplate.value = s.coach_template || '';
  } catch (e) { setMsg.textContent = 'Не вдалося завантажити: ' + e.message; }
}

document.getElementById('settingsbtn').onclick = () => {
  const show = setPanel.style.display === 'none';
  setPanel.style.display = show ? 'flex' : 'none';
  if (show) { setMsg.textContent = ''; loadSettings(); }
};
document.getElementById('set-close').onclick = () => { setPanel.style.display = 'none'; };
setSpeed.oninput = () => { setSpeedVal.textContent = Number(setSpeed.value).toFixed(2); };

// Прослухати обраний голос БЕЗ збереження
document.getElementById('set-testvoice').onclick = async () => {
  setMsg.style.color = 'var(--muted)';
  setMsg.textContent = 'Генерую зразок…';
  try {
    const fd = new FormData();
    fd.append('voice', setVoice.value);
    fd.append('lang', 'uk');
    fd.append('speed', setSpeed.value);
    const r = await fetch('/api/settings/test_voice', { method: 'POST', body: fd });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    const d = await r.json();
    setMsg.style.color = 'var(--ok)';
    setMsg.textContent = '▶ ' + setVoice.value + ' — слухай!';
    playB64(d.audio_b64, null, d.audio_mime);
  } catch (e) {
    setMsg.style.color = '#ff8080';
    setMsg.textContent = 'Помилка: ' + e.message;
  }
};

// Зберегти налаштування
document.getElementById('set-save').onclick = async () => {
  setMsg.style.color = 'var(--muted)';
  setMsg.textContent = 'Зберігаю…';
  try {
    const r = await fetch('/api/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        supertonic_voice: setVoice.value,
        supertonic_speed: parseFloat(setSpeed.value),
        tts_provider: setProvider.value,
        default_level: setDefaultLevel.value,
        default_scenario: setDefaultScenario.value,
        default_mode: setDefaultMode.value,
        default_target_lang: setTargetLang.value,
        coach_template: setCoachTemplate.value,
      }),
    });
    if (!r.ok) throw new Error((await r.json()).detail || r.status);
    setMsg.style.color = 'var(--ok)';
    setMsg.textContent = '✓ Збережено (діє одразу)';
    setTimeout(() => { setPanel.style.display = 'none'; }, 800);
  } catch (e) {
    setMsg.style.color = '#ff8080';
    setMsg.textContent = 'Помилка: ' + e.message;
  }
};

[levelEl, scenarioEl, modeEl, targetLangEl].forEach(el => {
  el.addEventListener('change', savePageState);
});
textEl.addEventListener('keydown', e => { if (e.key === 'Enter') sendText(); });
</script>
</body>
</html>
